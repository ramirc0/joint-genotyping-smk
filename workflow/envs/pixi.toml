[workspace]
name = "joint-genotyping-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
exclude-newer = "7d"

# Versions match clarity001/wgs-smk:latest as pulled on 2026-07-11, the image that produced the production results.
# That image ran OpenJDK 21.0.11, which conda-forge lacks.
[dependencies]
bcftools = "==1.24"
htslib = "==1.24"
openjdk = "==21.0.10"
picard = "==3.4.0"

# Versions match us.gcr.io/broad-gatk/gatk:latest as pulled on 2026-07-11.
# That image ran OpenJDK 17.0.12, which conda-forge lacks. Its tabix is Ubuntu's htslib 1.13. Bioconda's 1.13 to 1.19 conflict with that OpenJDK's zlib.
# The Python stack is the one TrainVariantAnnotationsModel and ScoreVariantAnnotations run, MKL BLAS included.
[feature.gatk.dependencies]
gatk4 = "==4.6.2.0"
openjdk = "==17.0.13"
htslib = "==1.20"
python = "==3.10.13"
dill = "==0.3.7"
h5py = "==3.10.0"
joblib = "==1.4.2"
libblas = { version = "==3.9.0", build = "*mkl" }
mkl = "==2022.2.1"
numpy = "==1.26.2"
pandas = "==2.1.3"
scikit-learn = "==1.3.2"
scipy = "==1.11.4"
threadpoolctl = "==3.6.0"

[environments]
gatk = { features = ["gatk"], no-default-feature = true }

[exclude-newer]
ca-certificates = "0d"
certifi = "0d"
pip = "0d"

[pypi-exclude-newer]
certifi = "0d"
pip = "0d"
