[workspace]
name = "joint-genotyping-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
exclude-newer = "7d"
preview = ["pixi-build"]

# bioconda's bcftools 1.25 pins gsl 2.6, which conflicts with Picard's r-base.
[dependencies]
bcftools = "==1.24"
htslib = "==1.24"
openjdk = "==25.0.2"
picard = "==3.5.0"

# bioconda pins gatk4-main to OpenJDK 17, though GATK builds for 17 or later. The local recipe lifts the pin.
# The Python stack that TrainVariantAnnotationsModel and ScoreVariantAnnotations run
# matches broadinstitute/gatk:4.7.0.0's conda env, MKL BLAS included.
[feature.gatk.dependencies]
gatk4-main = { path = "gatk4-main" }
openjdk = "==25.0.2"
htslib = "==1.25"
python = "==3.10.13"
dill = "==0.3.7"
h5py = "==3.10.0"
joblib = "==1.5.3"
libblas = { version = "==3.9.0", build = "*mkl" }
mkl = "==2022.2.1"
numpy = "==1.26.2"
pandas = "==2.1.3"
scikit-learn = "==1.3.2"
scipy = "==1.11.4"
threadpoolctl = "==3.6.0"

[environments]
gatk = { features = ["gatk"], no-default-feature = true }

# bcftools and htslib security fixes must not wait out the cutoff.
[exclude-newer]
bcftools = "0d"
htslib = "0d"
ca-certificates = "0d"
certifi = "0d"
pip = "0d"

[pypi-exclude-newer]
certifi = "0d"
pip = "0d"
