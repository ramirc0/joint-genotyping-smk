executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
max-jobs-per-timespan: 5/1s
# ILP re-solves a model per batch of finished jobs. It only pays off with temp()
# outputs. Greedy starts big-input jobs first, so give a small blocking rule `priority:`.
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10

default-resources:
  runtime: 30m
  mem_mb: 4000 * attempt

set-threads:
  split_interval_list: 2
  import_gvcfs: 6
  genotype_gvcfs: 2
  hard_filter: 2
  gather_sites_only_vcfs: 2
  extract_variant_annotations: 2
  train_variant_annotations_model: 2
  score_variant_annotations: 2
  gather_final_vcf: 2
  collect_variant_calling_metrics: 4

set-resources:              # JVM heaps leave rule-specific headroom below mem_mb
  split_interval_list:
    mem_mb: 62500 * attempt
    runtime: 30m
  import_gvcfs:
    mem_mb: 64000 * attempt
    runtime: 7200m
    slurm_partition: 5days
    constraint: cascadelake
    slurm_extra: "--cpu-freq=High-High:Performance"
  genotype_gvcfs:
    mem_mb: 26000 * attempt
    runtime: 7200m
    slurm_partition: 5days
    constraint: cascadelake
    slurm_extra: "--cpu-freq=High-High:Performance"
  hard_filter:
    mem_mb: 4000 * attempt
    runtime: 720m
    slurm_partition: 12hours
    constraint: cascadelake
    slurm_extra: "--cpu-freq=High-High:Performance"
  gather_sites_only_vcfs:
    mem_mb: 7000 * attempt
    runtime: 720m
    slurm_partition: 12hours
    constraint: cascadelake
    slurm_extra: "--cpu-freq=High-High:Performance"
  extract_variant_annotations:
    mem_mb: 12000 * attempt
    runtime: 240m
    slurm_partition: 4hours
    constraint: cascadelake
    slurm_extra: "--cpu-freq=High-High:Performance"
  train_variant_annotations_model:
    mem_mb: 24000 * attempt
    runtime: 240m
    slurm_partition: 4hours
    constraint: cascadelake
    slurm_extra: "--cpu-freq=High-High:Performance"
  score_variant_annotations:
    mem_mb: 24000 * attempt
    runtime: 240m
    slurm_partition: 4hours
    constraint: cascadelake
    slurm_extra: "--cpu-freq=High-High:Performance"
  gather_final_vcf:
    mem_mb: 32000 * attempt
    runtime: 240m
    slurm_partition: 4hours
    constraint: cascadelake
    slurm_extra: "--cpu-freq=High-High:Performance"
  collect_variant_calling_metrics:
    mem_mb: 15000 * attempt
    runtime: 720m
    slurm_partition: 12hours
    constraint: cascadelake
    slurm_extra: "--cpu-freq=High-High:Performance"

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
