# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 16
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:
  mem_mb: 4000
  runtime: 30

set-threads:
  split_interval_list: 2
  genotype_gvcfs: 2
  hard_filter: 2
  gather_sites_only_vcfs: 2
  extract_variant_annotations: 2
  train_variant_annotations_model: 2
  score_variant_annotations: 2
  gather_final_vcf: 2
  prepare_dbsnp: 4
  collect_variant_calling_metrics: 4

set-resources:              # JVM heaps leave rule-specific headroom below mem_mb
  split_interval_list: {mem_mb: 62500}
  genotype_gvcfs: {mem_mb: 32000}
  hard_filter: {mem_mb: 4000}
  gather_sites_only_vcfs: {mem_mb: 7000}
  extract_variant_annotations: {mem_mb: 12000}
  train_variant_annotations_model: {mem_mb: 24000}
  score_variant_annotations: {mem_mb: 24000}
  gather_final_vcf: {mem_mb: 32000}
  collect_variant_calling_metrics: {mem_mb: 15000}
